# @package _global_
#
# Qwen3-VL-30B-A3B-Instruct multi-image GRPO on MMRB (<=15000 image tokens per prompt), single 8-GPU H20 node.
#
# The dataset (loongsage/MMRB, built from HarrytheOrange/MMRB) has train.parquet (3922 rows) and
# validation.parquet (248 rows); letter / integer / Yes-No answers only. Samples whose images add up to
# more than 15000 estimated tokens are dropped at load time (max_image_tokens below).
#
# Set before launching: checkpoint_path, hf_model_path, data_source.dataset.prompt_data_path and
# data_source.dataset.eval_prompt_data_path.
#   hf download Qwen/Qwen3-VL-30B-A3B-Instruct --local-dir <hf_model_path>
#   hf download loongsage/MMRB --include "mmrb/*.parquet" --repo-type=dataset --local-dir <mmrb dir>
#
# Launch:
#   bash examples/start.sh qwen3_vl_30b_a3b/mmrb_h20_1node \
#     data_source.dataset.prompt_data_path=<mmrb dir>/mmrb/train.parquet \
#     data_source.dataset.eval_prompt_data_path=<mmrb dir>/mmrb/validation.parquet

defaults:
  - /default
  - _self_

checkpoint_path: ???
hf_model_path: ???
colocate: true
total_steps: 300

multimodal:
  enable: true
  modalities: [image]

data_source:
  dataset:
    prompt_data_path: ???
    eval_prompt_data_path: ???
    input_key: problem
    label_key: answer
    multimodal_keys: {image: images}
    max_image_tokens: 15000
  reward:
    name: boxed_math
  num_trajectories_per_prompt: 8
  num_prompts_per_step: 32
  max_response_len_per_trajectory: 20480

rollout:
  num_gpus_per_node: 8
  sglang_replicas:
    regular:
      num_nodes: 1
      num_gpus_per_replica: 4
  sglang_args:
    mem_fraction_static: 0.7
    disable_cuda_graph: false
  eval:
    interval: 5

agentflow:
  dump_trajectory_path: "log/trajectories"

trainer:
  num_gpus_per_node: 8
  num_nodes: 1
  mini_batch_size: 64
  max_tokens_per_gpu: 20480
  use_dynamic_batch_size: true
  save_freq: 5
  use_rollout_routing_replay: true
  use_fp32_lm_head: true

megatron:
  model:
    # Qwen3-VL-30B-A3B is MoE: tensor + pipeline + expert parallelism on 8 GPUs (TP4 x PP2, EP4).
    tensor_model_parallel_size: 4
    pipeline_model_parallel_size: 2
    virtual_pipeline_model_parallel_size: null
    context_parallel_size: 1
    expert_model_parallel_size: 4
    expert_tensor_parallel_size: 1
    # Qwen3-VL-MoE defaults both to True in Megatron-Bridge; make the choice explicit.
    freeze_vision_model: true
    freeze_language_model: false

algorithm:
  advantage_estimator: grpo
  advantage_norm_mode: group_zscore
  policy_loss: grpo
  loss_agg_mode: token-mean
