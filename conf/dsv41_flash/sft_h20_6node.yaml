# @package _global_
#
# SFT on DeepSeek-V4.1-Flash, 6-node H20 (6 x 8 = 48 GPUs), QAT. No inference engine is started.
#
# Train directly from the ORIGINAL release checkpoint (no BF16 conversion): the Megatron-Bridge
# V4.1 bridge dequantizes FP8/MXFP4 to bf16 on import (text-only, no MTP). trainer.qat snaps the
# quantized weights onto the FP8/MXFP4 grid after every optimizer step, so the result still serves
# in the checkpoint's own format. save_hf writes a drop-in copy of the source checkpoint (same
# shards / dtypes / config). 
#
#   hf download deepseek-ai/DeepSeek-V4.1-Flash-1017 --local-dir /root/DeepSeek-V4.1-Flash-1017
#   hf download HuggingFaceH4/no_robots --repo-type=dataset --include "data/train-*" --local-dir /root/no_robots
#
#   # Run the same command on every machine
#   bash examples/start_ray_cluster.sh <master-ip>
#
#   # Once the cluster is ready, run this on the head node only
#   bash examples/start.sh dsv41_flash/sft_h20_6node \
#     checkpoint_path=/root/ckpt/dsv41_sft_qat \
#     hf_model_path=/root/DeepSeek-V4.1-Flash-1017 \
#     data_source.dataset.prompt_data_path=/root/no_robots
#
# checkpoint_path and hf_model_path must live on storage that every node can reach
# through the same path.
defaults:
  - /default
  - _self_

run_mode: sft
checkpoint_path: ???
hf_model_path: ???
total_steps: 300

data_source:
  dataset:
    prompt_data_path: ???
    input_key: messages
    label_key: null
  num_trajectories_per_prompt: 1
  num_prompts_per_step: 16
  sft_max_seq_len: 24576

agentflow:
  tokenizer:
    generation_prompt_kwargs:
      # true if reasoning_content exists in the dataset
      thinking: true

trainer:
  num_gpus_per_node: 8
  num_nodes: 6
  mini_batch_size: ${data_source.num_prompts_per_step}
  max_tokens_per_gpu: 20480
  micro_batch_size: 1
  use_dynamic_batch_size: false
  use_fp32_lm_head: true
  save_freq: 5                       # save_hf=true writes a full checkpoint copy (~same size as hf_model_path)
  save_hf: true
  async_save: false
  nccl_timeout_minutes: 60
  gloo_timeout_minutes: 60
  deterministic_mode: true
  qat: true
  env_vars:
    PYTORCH_ALLOC_CONF: "expandable_segments:True,pinned_max_cached_size_mb:32"
    CODA_QAT_DISABLE_ACT: "1"

megatron:
  model:
    tensor_model_parallel_size: 4
    pipeline_model_parallel_size: 6
    # 40 layers do not divide evenly over PP=6 -> uneven split 6/7*4/6
    num_layers_in_first_pipeline_stage: 6
    num_layers_in_last_pipeline_stage: 6
    context_parallel_size: 2
    sequence_packing_scheduler: "default_dynamic_cp"
    attention_softmax_in_fp32: true
    cp_partition_mode: "contiguous"     # required for V4.1 context parallelism
    expert_model_parallel_size: 8
    expert_tensor_parallel_size: 1
    moe_shared_expert_overlap: false    # keep off (V4 shared-expert-overlap NaN RCA)
    recompute_granularity: full         # selective|full
    recompute_method: uniform
    recompute_num_layers: 1
  optimizer:
    lr: 1.0e-6
    chunked_optimizer_state_offload: true
    optimizer_state_offload_fraction: 1.0
    # Stage the fp32 masters per chunk too. Without this, the full fp32 master is loaded
    # onto GPU all at once during optimizer.step() instead of chunk by chunk, using an
    # extra ~45 GiB/rank.
    optimizer_state_offload_chunk_masters: true

algorithm:
  advantage_estimator: sft
  policy_loss: sft
  loss_agg_mode: token-mean
