# @package _global_
#
# Multi-image GRPO on MMRB (<=15000 image tokens per prompt) with DeepSeek-V4.1-Flash, 6-node H20
# (6 x 8 = 48 GPUs), QAT against an FP8/FP4 rollout.
#
# The dataset (loongsage/MMRB, built from HarrytheOrange/MMRB) has train.parquet (3922 rows) and
# validation.parquet (248 rows); letter / integer / Yes-No answers only. Samples whose images add up to
# more than max_image_tokens estimated tokens are dropped at load time. For DeepSeek-V4.1 the estimate comes
# from the checkpoint's own vision config, not from preprocessor_config.json pixel bounds.
#
# Set before launching: checkpoint_path, hf_model_path, data_source.dataset.prompt_data_path,
# data_source.dataset.eval_prompt_data_path. None of them has a usable default.
# checkpoint_path and hf_model_path must live on storage reachable by every node.
#   hf download deepseek-ai/DeepSeek-V4.1-Flash-1017 --local-dir <hf_model_path>
#   hf download loongsage/MMRB --include "*.parquet" --repo-type=dataset --local-dir <mmrb dir>
#   prompt_data_path      = <mmrb dir>/train.parquet
#   eval_prompt_data_path = <mmrb dir>/validation.parquet
#
# Rollout / eval: the Router patchifies images with SGLang's own V4.1 code, SGLang runs the ViT.
# Training: the Megatron VL model runs the frozen ViT, routes image tokens with bias_vl, and the vision
# weights are synced to SGLang with the rest (load_format stays the default dummy).
#
# Launch:
#   bash examples/start_ray_cluster.sh <head-node-ip>   # on every node first
#   bash examples/start.sh dsv41_flash/mmrb_h20_6node

defaults:
  - /default
  - _self_

checkpoint_path: ???
hf_model_path: ???
colocate: true
total_steps: 300

multimodal:
  enable: true
  modalities: [image]

data_source:
  dataset:
    prompt_data_path: ???
    eval_prompt_data_path: ???
    input_key: problem
    label_key: answer
    multimodal_keys: {image: images}
    max_image_tokens: 15000
  reward:
    name: boxed_math
  num_prompts_per_step: 32
  num_trajectories_per_prompt: 8
  max_response_len_per_trajectory: 32768

rollout:
  env_vars:
    SGLANG_ENABLE_DSV41_ENGRAM_HOST_TABLE: "1"
    SGLANG_DSV41_ENGRAM_HOST_TABLE_LAYOUT: "per_rank"
    SGLANG_DSV4_FP4_EXPERTS: "1"        # MXFP4 routed experts (flashinfer_mxfp4 CUTLASS, W4A16 on SM90)
    SGLANG_SHARED_EXPERT_TP1: "1"       # shared experts unsharded: 2304/16 is not 32-block aligned
    SGLANG_OPT_FP8_WO_A_GEMM: "0"       # no-op for 32x32 blocks (wo_a -> bf16); guard checked by the QAT adapter
    SGLANG_OPT_FUSE_WQA_WKV: "0"
    SGLANG_OPT_DEEPGEMM_HC_PRENORM: "0" # else mHC split-weight caches make sglang reject online weight updates
    SGLANG_OPT_USE_TILELANG_MHC_PRE: "0" # skips the mhc_pre prewarm (V4.1 forward never calls it)
    SGLANG_OPT_HOPPER_BLOCK_FP8_BF16: "0" # same for the bf16 copy of 32x32 FP8 linears DeepGEMM cannot run
    NCCL_CUMEM_ENABLE: "1"
  retry_limit: 3
  num_gpus_per_node: 8
  sglang_args:
    image_processor_backend: pil                # same patchify as the Router, see doc 4.3
    moe_runner_backend: flashinfer_mxfp4        # the backend with the in-place MXFP4 hot update
    flashinfer_mxfp4_moe_precision: bf16        # W4A16 (QAT does not model expert act quant)
    disable_shared_experts_fusion: true         # keep shared experts as dense FP8 linears
    mem_fraction_static: 0.75
    max_total_tokens: 10000000 #10M tokens
    disable_cuda_graph: false
    ep_size: 8
    attention_backend: dsv4
    # 0.5.23 auto-enables this on TP-only V4.1; it is not numerically identical to full prefill and
    # computes only the last SWA window rows in the tail layers, which misaligns R3 routed experts.
    enable_decoder_swa_bounded_replay: false
    max_running_requests: 128
  sglang_replicas:
    regular:
      num_nodes: 6
      num_gpus_per_replica: 8
  use_fault_tolerance: true
  eval:
    interval: 25

agentflow:
  dump_trajectory_path: "log/trajectories"
  router:
    proxy_timeout_seconds: 1800
  tokenizer:
    generation_prompt_kwargs:
      thinking: true

trainer:
  num_gpus_per_node: 8
  num_nodes: 6
  mini_batch_size: 128
  max_tokens_per_gpu: 20480
  use_dynamic_batch_size: true
  use_rollout_routing_replay: true
  use_fp32_lm_head: true
  save_freq: 50             # save_hf=true writes a full checkpoint copy (~same size as hf_model_path)
  save_hf: true
  async_save: false
  nccl_timeout_minutes: 60
  gloo_timeout_minutes: 60
  deterministic_mode: true
  qat: true
  env_vars:
    PYTORCH_ALLOC_CONF: "expandable_segments:True,pinned_max_cached_size_mb:32"
    CODA_QAT_DISABLE_ACT: "1"

megatron:
  model:
    tensor_model_parallel_size: 4
    pipeline_model_parallel_size: 6
    # 40 layers do not divide evenly over PP=6 -> uneven split 6/7*4/6
    num_layers_in_first_pipeline_stage: 6
    num_layers_in_last_pipeline_stage: 6
    context_parallel_size: 1
    sequence_packing_scheduler: "default_dynamic_cp"
    attention_softmax_in_fp32: true
    cp_partition_mode: "contiguous"     # required for V4.1; CP=1 passes the VLM check
    expert_model_parallel_size: 8
    expert_tensor_parallel_size: 1
    moe_shared_expert_overlap: false    # keep off (V4 shared-expert-overlap NaN RCA)
    recompute_granularity: full         # selective|full
    recompute_method: uniform
    recompute_num_layers: 1
  optimizer:
    lr: 1.0e-6
    chunked_optimizer_state_offload: true
    optimizer_state_offload_fraction: 1.0

algorithm:
  advantage_estimator: grpo
  advantage_norm_mode: group_zscore
  policy_loss: grpo
  loss_agg_mode: token-mean
  is_correction:
    enable: true
    action: mask
    level: token
    lower_bound: 0.5
    upper_bound: 2
