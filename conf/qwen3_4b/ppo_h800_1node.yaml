# @package _global_
# Qwen3-4B + PPO (GAE + critic), single H800 node (8 GPUs).
# Same setup as dapo_h800_1node, with a co-located critic instead of
# group-normalized rewards.
# Launch: bash examples/start.sh qwen3_4b/ppo_h800_1node
# Fill in the two ??? below, or override them on the command line:
#   hf_model_path                         HF weight dir of Qwen3-4B
#   data_source.dataset.prompt_data_path  dapo-math-17k.parquet
defaults:
  - /default
  - _self_

checkpoint_path: ./checkpoints
hf_model_path: ???
colocate: true
total_steps: 100

data_source:
  dataset:
    prompt_data_path: ???
    input_key: prompt
    label_key: reward_model
  reward:
    name: dapo_math
    overlong_penalty_length: 4096
  # PPO needs no prompt groups: one trajectory per prompt (required for now).
  num_prompts_per_step: 64
  num_trajectories_per_prompt: 1
  max_response_len_per_trajectory: 20480

rollout:
  num_gpus_per_node: 8
  sglang_args:
    mem_fraction_static: 0.7
    disable_cuda_graph: false

agentflow:
  dump_trajectory_path: "log/trajectories"

trainer:
  mini_batch_size: 16
  max_tokens_per_gpu: 20480
  use_dynamic_batch_size: true

megatron:
  model:
    tensor_model_parallel_size: 4
    pipeline_model_parallel_size: 2
    virtual_pipeline_model_parallel_size: null
    context_parallel_size: 1
    expert_model_parallel_size: 1
    expert_tensor_parallel_size: 1

critic:
  enable: true
  optimizer:
    lr: 5.0e-6              # the value head starts from scratch; critics usually use a larger lr
  critic_warmup: 2          # train only the critic for the first steps
  value_head_init_std: 0.02

algorithm:
  advantage_estimator: gae
  policy_loss: ppo
  use_masked_whiten: true
  loss_agg_mode: token-mean
  clip_ratio_low: 0.2
  clip_ratio_high: 0.28
  clip_ratio_c: 3.0
  ppo:
    value_clip: 0.2
    gamma: 1.0
    lam: 1.0
  is_correction:
    enable: true
    action: mask
    level: token
    lower_bound: 0.5
    upper_bound: 2
