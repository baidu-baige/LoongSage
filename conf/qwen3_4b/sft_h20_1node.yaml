# @package _global_
#
# Qwen3-4B SFT, single H20 node (8 GPUs). No inference engine is started.
#
#   hf download Qwen/Qwen3-4B --local-dir /root/Qwen3-4B
#   hf download HuggingFaceH4/no_robots --repo-type=dataset --include "data/train-*" --local-dir /root/no_robots
#
#   bash examples/start.sh qwen3_4b/sft_h20_1node \
#     hf_model_path=/root/Qwen3-4B \
#     data_source.dataset.prompt_data_path=/root/no_robots
#
defaults:
  - /default
  - _self_

run_mode: sft
checkpoint_path: ./checkpoints
hf_model_path: ???
total_steps: 100

data_source:
  dataset:
    prompt_data_path: ???
    input_key: messages
    label_key: null
  num_prompts_per_step: 64       # global batch size (conversations per optimizer step)
  num_trajectories_per_prompt: 1
  sft_max_seq_len: 16384         # truncate each rendered conversation to this many tokens

trainer:
  mini_batch_size: 64            # == num_prompts_per_step: one optimizer step per training step
  max_tokens_per_gpu: 20480
  use_dynamic_batch_size: true

megatron:
  model:
    tensor_model_parallel_size: 2
    pipeline_model_parallel_size: 1
    virtual_pipeline_model_parallel_size: null
    context_parallel_size: 1
    expert_model_parallel_size: 1
    expert_tensor_parallel_size: 1

algorithm:
  advantage_estimator: sft
  policy_loss: sft
  loss_agg_mode: token-mean
