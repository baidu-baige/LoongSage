# @package _global_
#
# DAPO math with DeepSeek-V4.1-Flash on 5-node B200 (5 x 8 = 40 GPUs).
#
# Download the model and dataset first, then convert the model to BF16 weights
# for training:
#
#   hf download deepseek-ai/DeepSeek-V4.1-Flash --local-dir /root/DeepSeek-V4.1-Flash
#   hf download Haitao999/DAPO-Math-17k-unique --repo-type=dataset --local-dir /root/dapo-math
#
#   python examples/convert_dsv41_to_bf16.py \
#     --src /root/DeepSeek-V4.1-Flash \
#     --dst /root/DeepSeek-V4.1-Flash-BF16
#
# After conversion, launch the 5-node B200 preset dsv41_flash_bf16/dapo_b200_5node:
# bring up the Ray cluster on every node and submit the training job from the head
# node only.
#
#   # Run the same command on every machine
#   bash examples/start_ray_cluster.sh <master-ip>
#
#   # Once the cluster is ready, run this on the head node only
#   bash examples/start.sh dsv41_flash_bf16/dapo_b200_5node \
#     checkpoint_path=/root/ckpt/dsv41_dapo \
#     hf_model_path=/root/DeepSeek-V4.1-Flash-BF16 \
#     data_source.dataset.prompt_data_path=/root/dapo-math
#
# checkpoint_path and hf_model_path must live on storage that every node can reach
# through the same path.
defaults:
  - /default
  - _self_

checkpoint_path: ???
hf_model_path: ???
colocate: false
total_steps: 300

data_source:
  dataset:
    prompt_data_path: ???
    input_key: prompt
    label_key: reward_model
  reward:
    name: dapo_math
    overlong_penalty_length: 4096
  num_prompts_per_step: 16
  num_trajectories_per_prompt: 8
  max_response_len_per_trajectory: 20480

rollout:
  env_vars:
    SGLANG_ENABLE_DSV41_ENGRAM_HOST_TABLE: "1"
    SGLANG_DSV4_FP4_EXPERTS: "0"
    SGLANG_OPT_FP8_WO_A_GEMM: "0"
    SGLANG_OPT_FUSE_WQA_WKV: "0"
    # Else mHC split-weight caches make sglang reject online weight updates.
    SGLANG_OPT_DEEPGEMM_HC_PRENORM: "0"
    # With HC_PRENORM=0 the load-time mhc_pre prewarm (run on the first weight sync under
    # load_format=dummy) hits a TileLang kernel without hc_hidden_size 20480. V4.1 forward never
    # calls mhc_pre (hc_pre_from_prev_sublayer path), so this only skips that prewarm.
    SGLANG_OPT_USE_TILELANG_MHC_PRE: "0"
    NCCL_CUMEM_ENABLE: "1"
  num_gpus_per_node: 8
  sglang_args:
    mem_fraction_static: 0.85
    disable_cuda_graph: false
    ep_size: 8
    attention_backend: dsv4
    # Pin FlashMLA (V4 KV layout, which the trainer's kv_cache_roundtrip models); attention TP 1 on
    # SM100 would auto-select flashmla_mega and switch to the V41 layout.
    dsv4_attn_backend: flashmla
    # 0.5.23 auto-enables this on TP-only V4.1; it is not numerically identical to full prefill and
    # computes only the last SWA window rows in the tail layers, which misaligns R3 routed experts.
    enable_decoder_swa_bounded_replay: false
    moe_runner_backend: auto
    max_running_requests: 128
  sglang_replicas:
    regular:
      num_nodes: 1
      num_gpus_per_replica: 8
  use_fault_tolerance: true

agentflow:
  dump_trajectory_path: "log/trajectories"
  router:
    proxy_timeout_seconds: 1800
  tokenizer:
    generation_prompt_kwargs:
      thinking: true

trainer:
  num_gpus_per_node: 8
  num_nodes: 4
  mini_batch_size: 128
  max_tokens_per_gpu: 20480
  micro_batch_size: 1
  use_dynamic_batch_size: false
  use_rollout_routing_replay: true   # R3 (on by default for V4.1)
  use_fp32_lm_head: true
  save_freq: 5
  async_save: false
  nccl_timeout_minutes: 60
  gloo_timeout_minutes: 60
  env_vars:
    PYTORCH_ALLOC_CONF: "expandable_segments:True,pinned_max_cached_size_mb:32"

megatron:
  model:
    tensor_model_parallel_size: 8
    pipeline_model_parallel_size: 4
    context_parallel_size: 1
    sequence_packing_scheduler: "default_dynamic_cp"
    attention_softmax_in_fp32: true
    cp_partition_mode: "contiguous"     # required for V4.1 context parallelism
    expert_model_parallel_size: 8
    expert_tensor_parallel_size: 1
    moe_shared_expert_overlap: false    # keep off (V4 shared-expert-overlap NaN RCA)
    recompute_granularity: full         # selective|full
    recompute_method: uniform
    recompute_num_layers: 1
  optimizer:
    lr: 1.0e-6
    chunked_optimizer_state_offload: true
    optimizer_state_offload_fraction: 1.0

algorithm:
  advantage_estimator: grpo
  advantage_norm_mode: group_zscore
  policy_loss: grpo
  loss_agg_mode: token-mean
  is_correction:
    enable: true
    action: mask
    level: token
    lower_bound: 0.5
    upper_bound: 2
