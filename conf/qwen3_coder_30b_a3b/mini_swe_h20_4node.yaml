# @package _global_
#
# mini swe config for Qwen3-Coder-30B-A3B on a 4-node H20 cluster. Three fields are
# required (???) and must be set before launching:
#
#   checkpoint_path: where trainer checkpoints are written/resumed from.
#     Set this to a path on shared/cloud storage reachable by every node,
#     e.g. checkpoint_path: /path/to/checkpoints/mini-swe-r2e-gym
#
#   hf_model_path: local path to the base model, loaded by the trainer/rollout workers.
#     1. Download it from Hugging Face to shared/cloud storage reachable by every node
#          hf download Qwen/Qwen3-Coder-30B-A3B-Instruct --local-dir /path/to/models/Qwen3-Coder-30B-A3B-Instruct
#     2. set hf_model_path to the shared/cloud storage path,
#        e.g. hf_model_path: /path/to/models/Qwen3-Coder-30B-A3B-Instruct
#
#   data_source.dataset.prompt_data_path: parquet dataset of prompts used for rollout.
#     Read only on the launching node, so any local directory works.
#     1. Download the raw dataset from Hugging Face
#          hf download hf://datasets/R2E-Gym/R2E-Gym-Subset --local-dir /path/to/R2E-Gym-Subset
#     2. set data_source.dataset.prompt_data_path to the storage path,
#        e.g. data_source.dataset.prompt_data_path: /path/to/R2E-Gym-Subset
#
# then exec by command:
#   bash examples/start_ray_cluster.sh [master-ip]  # on every node first
#   bash examples/start.sh qwen3_coder_30b_a3b/mini_swe_h20_4node

defaults:
  - /default
  - _self_

checkpoint_path: ???
hf_model_path: ???
colocate: true
total_steps: 300
log_level: INFO  # DEBUG INFO WARNING ERROR CRITICAL

data_source:
  dataset:
    prompt_data_path: ???
    data_pre_processor: r2e_gym
    input_key: prompt
    label_key: label
    metadata_key: metadata
  agent:
    name: mini-swe
    step_limit: 50
    request_timeout: 1200
    max_consecutive_format_errors: 10
  reward:
    name: r2e_gym
  num_trajectories_per_prompt: 8
  num_prompts_per_step: 16
  max_response_len_per_trajectory: 16384

rollout:
  retry_limit: 5
  num_gpus_per_node: 8
  sglang_replicas:
    regular:
      num_nodes: 4
      num_gpus_per_replica: 8
  sglang_args:
    tp_size: 8
    ep_size: 8
    mem_fraction_static: 0.8
    disable_cuda_graph: false
    # skip_server_warmup: false
    # enable_fp32_lm_head: false
    # max_prefill_tokens: 16384
  # env_vars:
  #   SGLANG_RMSNORM_NO_PDL: "1"
  use_fault_tolerance: true

agentflow:
  dump_trajectory_path: "log/trajectories"
  router:
    proxy_timeout_seconds: 1800
  tokenizer:
    generation_prompt_kwargs:
      enable_thinking: true

trainer:
  num_gpus_per_node: 8
  num_nodes: 4
  mini_batch_size: 128
  micro_batch_size: 1
  max_tokens_per_gpu: 8192
  use_dynamic_batch_size: false
  use_rollout_routing_replay: true
  use_fp32_lm_head: true

megatron:
  model:
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 4
    virtual_pipeline_model_parallel_size: null
    context_parallel_size: 1
    expert_model_parallel_size: 8
    expert_tensor_parallel_size: 1
    # sequence_packing_scheduler: "default_dynamic_cp"
    # cp_partition_mode: "contiguous"
    dsa_indexer_loss_coeff: 0.0
    apply_dsa_kernel_fusion: true
    recompute_granularity: full # selective|full
    recompute_method: uniform
    recompute_num_layers: 1
  optimizer:
    lr: 5.0e-7
    optimizer_cpu_offload: true
    optimizer_offload_fraction: 1

algorithm:
  advantage_estimator: grpo
  advantage_norm_mode: group_zscore
  policy_loss: grpo
  loss_agg_mode: token-mean
  #policy_loss: gspo
  #loss_agg_mode: seq-mean-token-mean
  #clip_ratio_low: 3e-4
  #clip_ratio_high: 4e-4
  is_correction:
    enable: false
    action: mask
    level: token
    lower_bound: 0.5
    upper_bound: 2
