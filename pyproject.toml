[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "LoongSage"
version = "0.1.0"
description = "LoongSage: a scalable RL post-training framework for LLMs and agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

# Runtime dependencies are currently pinned in docker/Dockerfile and are not
# duplicated here; LoongSage is expected to run inside the provided image.
dependencies = []

[project.optional-dependencies]
# Just the test runner. Use the "ci" extra to actually import coda.
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

# The CPU-installable subset needed to import coda and run tests/ut. Deliberately
# excludes the GPU-only stack (megatron-core, transformer-engine, sglang, apex,
# nvidia-resiliency-ext); tests needing those skip via pytest.importorskip.
# Versions track docker/Dockerfile where it pins them.
ci = [
    "coda[test]",
    "torch>=2.4",
    "numpy>=1.26",
    "omegaconf==2.3.1",
    "hydra-core==1.3.4",
    "ray>=2.54.0",
    "mlflow==3.14.0",
    "wandb==0.28.0",
    "mini-swe-agent==2.4.5",
    "litellm==1.80.0",
    "transformers>=4.44",
    "safetensors>=0.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "psutil>=5.9",
    "requests>=2.31",
    "PyYAML>=6.0",
]

[tool.setuptools.packages.find]
include = ["coda*"]

[tool.pytest.ini_options]
testpaths = ["tests/ut"]
# Async tests are written as bare `async def` with @pytest.mark.asyncio; auto
# mode makes both that and unmarked coroutines run without per-test plumbing.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "cuda: requires a CUDA device",
    "multi_gpu: requires at least 2 CUDA devices",
    "megatron: requires a Megatron-Core installation",
]
norecursedirs = ["output", "outputs", "log", "docs", "examples", "docker", ".git"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
