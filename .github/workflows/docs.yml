name: Docs

# Builds the bilingual Sphinx site and publishes it to GitHub Pages at
# https://baidu-baige.github.io/LoongSage/ (Chinese under /zh/).
#
# Deployment goes through the official artifact route, so the generated HTML is
# never committed to any branch: Settings -> Pages -> Source must be set to
# "GitHub Actions" for this to take effect.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write # publish the artifact to Pages
  id-token: write # OIDC token that deploy-pages exchanges for the deployment

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build (en + zh)
    # Forks inherit this workflow but have no business deploying to our site.
    if: github.repository == 'baidu-baige/LoongSage'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation toolchain
        # Sphinx only converts Markdown to HTML and never imports the package,
        # so none of the runtime or GPU dependencies are needed here.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt

      - name: Build both language trees
        # The same three commands as docs/preview.sh: English at the site root,
        # Chinese moved underneath it, so the artifact is the complete site.
        env:
          SPHINX_OPTS: "-W --keep-going" # warnings are errors, report them all
        run: |
          bash docs/build.sh en
          bash docs/build.sh zh
          mv docs/build/zh docs/build/en/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/en

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
